<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 676 904" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">VIBECODEINE double cup, ASCII silhouette and spill loop</title>
  <desc id="desc">A double cup is woven from README glyphs. Density, colour and ASCII symbols distinguish the mouth, upper band, seam, lower band and tapered body. The vector lines only clarify the structure; they do not replace the text material. The 24 second cycle returns to its exact first state.</desc>
  <defs>
    <linearGradient id="liquid-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d0fe"/>
      <stop offset=".42" stop-color="#d946ef"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <radialGradient id="ground-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c026d3" stop-opacity=".52"/>
      <stop offset="1" stop-color="#08070a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <style>
    :root { --canvas:#08070a; --ink:#f8fafc; --purple:#c026d3; --violet:#7e22ce; }
    .canvas { fill:var(--canvas); }
    .ground { fill:url(#ground-glow); filter:url(#soft-glow); }
    .ascii-vessel { transform-box:fill-box; transform-origin:center; }
    .ascii-vessel text { font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:12px; letter-spacing:.6px; font-weight:500; white-space:pre; }
    .glass { fill:#f5f3ff; opacity:.92; }
    .upper-band { fill:#ddd6fe; opacity:.9; }
    .lower-band { fill:#c4b5fd; opacity:.86; }
    .seam { fill:#160b1c; opacity:1; }
    .body { fill:#c084fc; opacity:.82; }
    .foot { fill:#a855f7; opacity:.72; }
    .liquid { fill:url(#liquid-gradient); opacity:1; }
    .structure { fill:none; stroke:#f8fafc; stroke-opacity:.7; stroke-width:4; stroke-linejoin:round; }
    .structure-soft { fill:none; stroke:#d8b4fe; stroke-opacity:.44; stroke-width:3; }
    .spill { fill:none; stroke:url(#liquid-gradient); stroke-width:18; stroke-linecap:round; stroke-linejoin:round; }
    .droplet { fill:#d946ef; }
    .readme-title { fill:#f5d0fe; font-family:ui-monospace, SFMono-Regular, Consolas, monospace; font-size:10px; letter-spacing:1px; opacity:.86; }
    @media (prefers-reduced-motion:reduce) {
      .ascii-vessel, .ascii-vessel *, .ground, .spill, .droplet { animation:none !important; }
    }
  </style>
