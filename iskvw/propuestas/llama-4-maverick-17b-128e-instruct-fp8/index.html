<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISKVW</title>
    <style>
        body { margin: 0; background-color: #f0f0f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { position: relative; width: 100%; height: 100vh; overflow: hidden; }
        #canvas { width: 100%; height: 100%; display: block; }
        .controls { position: absolute; top: 10px; right: 10px; background: rgba(0, 0, 0, 0.7); color: white; padding: 10px; border-radius: 5px; }
        .controls label { display: block; margin-bottom: 5px; }
        button { margin: 5px 0; padding: 5px 10px; width: 100%; }
        #legend { position: absolute; bottom: 10px; left: 10px; background: rgba(0, 0, 0, 0.7); color: white; padding: 10px; border-radius: 5px; font-size: 12px; }
        #status { position: absolute; top: 10px; left: 10px; background: rgba(0, 0, 0, 0.7); color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <div class="controls">
            <label><input type="checkbox" id="show-links" checked> Mostrar vínculos</label>
            <label><input type="checkbox" id="show-labels"> Mostrar etiquetas</label>
            <label><input type="checkbox" id="filter-manual" checked> Vínculos manuales</label>
            <label><input type="checkbox" id="filter-etiqueta"> Vínculos por etiqueta</label>
            <button id="reset">Reiniciar</button>
        </div>
        <div id="legend">
            <span style="color: red;">■</span> Vínculo manual<br>
            <span style="color: green;">■</span> Vínculo por etiqueta
        </div>
        <div id="status"></div>
    </div>
    <script>
        let data;
        let canvas;
        let ctx;
        let nodes = {};
        let links = [];
        let showLinks = true;
        let showLabels = false;
        let filterManual = true;
        let filterEtiqueta = false;

        fetch('../../datos/archivo.json')
            .then(response => {
                if (!response.ok) throw new Error('Error al cargar archivo.json');
                return response.json();
            })
            .then(jsonData => {
                data = jsonData;
                init();
            })
            .catch(error => {
                document.body.innerHTML = '<h1>Error al cargar los datos</h1><p>' + error.message + '</p>';
            });

        function init() {
            canvas = document.getElementById('canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            data.piezas.forEach(pieza => {
                nodes[pieza.id] = {
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    clase: pieza.clase,
                    titulo: pieza.titulo,
                };
            });

            links = data.vinculos.map(vinculo => ({
                source: nodes[vinculo.de],
                target: nodes[vinculo.a],
                peso: vinculo.peso,
                clase: vinculo.clase
            }));

            document.getElementById('show-links').addEventListener('change', e => {
                showLinks = e.target.checked;
            });

            document.getElementById('show-labels').addEventListener('change', e => {
                showLabels = e.target.checked;
            });

            document.getElementById('filter-manual').addEventListener('change', e => {
                filterManual = e.target.checked;
                updateStatus();
            });

            document.getElementById('filter-etiqueta').addEventListener('change', e => {
                filterEtiqueta = e.target.checked;
                updateStatus();
            });

            document.getElementById('reset').addEventListener('click', resetSimulation);

            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const factor = 1 - e.deltaY * 0.01;
                Object.values(nodes).forEach(node => {
                    node.x = canvas.width / 2 + (node.x - canvas.width / 2) * factor;
                    node.y = canvas.height / 2 + (node.y - canvas.height / 2) * factor;
                });
            });

            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);

            canvas.addEventListener('mousedown', e => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const node = Object.values(nodes).find(node => Math.hypot(node.x - x, node.y - y) < 10);
                if (node) {
                    alert(`Título: ${node.titulo}\nClase: ${node.clase}`);
                }
            });

            resetSimulation();
            updateStatus();
            tick();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (showLinks) {
                links.forEach(link => {
                    if ((link.clase === 'manual' && filterManual) || (link.clase === 'etiqueta' && filterEtiqueta)) {
                        ctx.beginPath();
                        ctx.moveTo(link.source.x, link.source.y);
                        ctx.lineTo(link.target.x, link.target.y);
                        ctx.strokeStyle = link.clase === 'manual' ? 'red' : 'green';
                        ctx.lineWidth = link.peso * 2;
                        ctx.stroke();
                    }
                });
            }
            Object.values(nodes).forEach(node => {
                ctx.beginPath();
                ctx.arc(node.x, node.y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = node.clase === 'obra' ? 'blue' : node.clase === 'pieza_grafica' ? 'purple' : 'gray';
                ctx.fill();
                if (showLabels) {
                    ctx.fillStyle = 'black';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.font = '12px Arial';
                    ctx.fillText(node.titulo, node.x, node.y + 5);
                }
            });
        }

        function tick() {
            links.forEach(link => {
                const dx = link.target.x - link.source.x;
                const dy = link.target.y - link.source.y;
                const angle = Math.atan2(dy, dx);
                const dist = Math.sqrt(dx * dx + dy * dy);
                const force = (dist - 100) * 0.01;
                link.source.x += Math.cos(angle) * force;
                link.source.y += Math.sin(angle) * force;
                link.target.x -= Math.cos(angle) * force;
                link.target.y -= Math.sin(angle) * force;
            });
            draw();
            requestAnimationFrame(tick);
        }

        function resetSimulation() {
            Object.values(nodes).forEach(node => {
                node.x = Math.random() * canvas.width;
                node.y = Math.random() * canvas.height;
            });
        }

        function updateStatus() {
            const status = document.getElementById('status');
            status.textContent = `Vínculos mostrados: ${filterManual ? 'manuales' : ''} ${filterEtiqueta ? 'etiquetas' : ''}`.trim() || 'Ningún vínculo';
        }

        let touchStartDistance = null;
        function handleTouchStart(e) {
            if (e.touches.length === 2) {
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                touchStartDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }

        function handleTouchMove(e) {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const touchMoveDistance = Math.sqrt(dx * dx + dy * dy);
                const factor = touchMoveDistance / touchStartDistance;
                Object.values(nodes).forEach(node => {
                    node.x = canvas.width / 2 + (node.x - canvas.width / 2) * factor;
                    node.y = canvas.height / 2 + (node.y - canvas.height / 2) * factor;
                });
                touchStartDistance = touchMoveDistance;
            }
        }
    </script>
</body>
</html>
