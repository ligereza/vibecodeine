<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" data-name="01-paradise-garage">
<style>
  /* ══ PALETA — edita libremente estos valores ══ */
  svg{
    --papel: #f2e7d2;
    --tinta: #14141a;
    --rayo: #e2452c;
    --disco: #1f4fd8;
    /* ── velocidades (mayor = más lento) ── */
    --vel-rayos: 7s;
    --vel-rayas: 1.6s;
    --vel-baile: 1.5s;
  }

.i1bg{fill:var(--papel)}.i1k{fill:none;stroke:var(--tinta);stroke-width:5;stroke-linecap:square}
.i1r{fill:var(--rayo)}.i1sun{fill:var(--disco)}
.i1rays{transform-origin:60px 47px;animation:i1sw var(--vel-rayos) ease-in-out infinite}
@keyframes i1sw{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}}
.i1stripes{animation:i1sp var(--vel-rayas) linear infinite}
@keyframes i1sp{to{transform:translateX(8px)}}
.i1d{animation:i1b var(--vel-baile) ease-in-out infinite}
.i1d:nth-of-type(2){animation-delay:.25s}.i1d:nth-of-type(3){animation-delay:.5s}
@keyframes i1b{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<rect class="i1bg" width="120" height="120"/>
<g class="i1rays" opacity=".85">
  <path class="i1r" d="M60,47 L36,-6 L52,-6Z"/><path class="i1r" d="M60,47 L84,-6 L68,-6Z"/>
  <path class="i1r" d="M60,47 L4,26 L4,40Z"/><path class="i1r" d="M60,47 L116,26 L116,40Z"/>
  <path class="i1r" d="M60,47 L18,92 L28,100Z" opacity=".55"/><path class="i1r" d="M60,47 L102,92 L92,100Z" opacity=".55"/>
</g>
<clipPath id="c1"><circle cx="60" cy="47" r="17"/></clipPath>
<circle class="i1sun" cx="60" cy="47" r="17"/>
<g clip-path="url(#c1)" stroke="var(--papel)" stroke-width="1.4" opacity=".85">
  <g class="i1stripes"><path d="M36,30v34M44,30v34M52,30v34M60,30v34M68,30v34M76,30v34M84,30v34"/></g>
  <path d="M40,40h40M38,47h44M40,54h40"/>
</g>
<path class="i1k" d="M16,104V64a44,44 0 0 1 88,0v40"/>
<rect x="8" y="104" width="104" height="7" fill="var(--tinta)"/>
<g fill="var(--tinta)"><rect class="i1d" x="34" y="86" width="7" height="18" rx="3.5"/><rect class="i1d" x="56" y="82" width="7" height="22" rx="3.5"/><rect class="i1d" x="78" y="88" width="7" height="16" rx="3.5"/></g>
</svg>
