<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" data-name="04-ibiza-balearic-1987">
<style>
  /* ══ PALETA — edita libremente estos valores ══ */
  svg{
    --cielo-alto: #2b1055;
    --cielo-medio: #a83279;
    --cielo-bajo: #ff7a3d;
    --sol-alto: #ffe259;
    --sol-bajo: #ff5f6d;
    --fondo: #150a24;
    --mar: #1b0a2e;
    --olas: #ff9c5b;
    /* ── velocidades (mayor = más lento) ── */
    --vel-sol: 6s;
    --vel-mar: 3.2s;
    --vel-puntos: 2s;
  }

.i4sun{animation:i4up var(--vel-sol) ease-in-out infinite}
@keyframes i4up{0%,100%{transform:translateY(4px)}50%{transform:translateY(-3px)}}
.i4sea path{animation:i4w var(--vel-mar) ease-in-out infinite}
.i4sea path:nth-child(2){animation-delay:.4s}.i4sea path:nth-child(3){animation-delay:.8s}
@keyframes i4w{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
.i4dot{animation:i4p var(--vel-puntos) ease-in-out infinite}
.i4dot:nth-of-type(2){animation-delay:.3s}.i4dot:nth-of-type(3){animation-delay:.6s}.i4dot:nth-of-type(4){animation-delay:.9s}
@keyframes i4p{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-5px);opacity:1}}
</style>
<defs>
<linearGradient id="g4s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cielo-alto)"/><stop offset=".55" stop-color="var(--cielo-medio)"/><stop offset="1" stop-color="var(--cielo-bajo)"/></linearGradient>
<linearGradient id="g4b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sol-alto)"/><stop offset="1" stop-color="var(--sol-bajo)"/></linearGradient>
<clipPath id="c4"><circle cx="60" cy="60" r="50"/></clipPath>
</defs>
<rect width="120" height="120" fill="var(--fondo)"/>
<g clip-path="url(#c4)">
  <rect x="10" y="10" width="100" height="100" fill="url(#g4s)"/>
  <g class="i4sun"><circle cx="60" cy="66" r="27" fill="url(#g4b)"/>
    <g fill="var(--cielo-medio)" opacity=".55"><rect x="30" y="62" width="60" height="3.4"/><rect x="30" y="69" width="60" height="4.4"/><rect x="30" y="77" width="60" height="5.4"/><rect x="30" y="86" width="60" height="6.4"/></g>
  </g>
  <rect x="10" y="88" width="100" height="24" fill="var(--mar)"/>
  <g class="i4sea" stroke="var(--olas)" stroke-width="2" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M14,95h20M44,95h22M76,95h22"/><path d="M20,102h26M56,102h18M84,102h20"/><path d="M16,109h18M46,109h30M86,109h16"/>
  </g>
  <g fill="var(--sol-alto)">
    <circle class="i4dot" cx="40" cy="42" r="3.4"/><circle class="i4dot" cx="53" cy="36" r="3.4"/><circle class="i4dot" cx="67" cy="36" r="3.4"/><circle class="i4dot" cx="80" cy="42" r="3.4"/>
  </g>
</g>
<circle cx="60" cy="60" r="50" fill="none" stroke="var(--sol-alto)" stroke-width="3.5"/>
<circle cx="60" cy="60" r="55" fill="none" stroke="var(--sol-alto)" stroke-width="1.2" opacity=".5" stroke-dasharray="2 4"/>
</svg>
