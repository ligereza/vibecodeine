<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" data-name="05-shoom-smiley-acid-house">
<style>
  /* ══ PALETA — edita libremente estos valores ══ */
  svg{
    --fondo: #12120a;
    --aura: #d7ff2e;
    --cara: #e8ff33;
    /* ── velocidades (mayor = más lento) ── */
    --vel-cara: 3s;
    --vel-parpadeo: 4s;
    --vel-goteo: 2.6s;
  }

.i5f{transform-origin:60px 58px;animation:i5wob var(--vel-cara) ease-in-out infinite}
@keyframes i5wob{0%,100%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.05)}}
.i5eye{transform-origin:center;animation:i5blink var(--vel-parpadeo) ease-in-out infinite}
@keyframes i5blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.i5drip{animation:i5dr var(--vel-goteo) ease-in infinite}
.i5drip:nth-of-type(2){animation-delay:1.1s}
@keyframes i5dr{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(30px);opacity:0}}
.i5ring{transform-origin:60px 58px;animation:i5rg var(--vel-goteo) ease-out infinite}
@keyframes i5rg{0%{transform:scale(.85);opacity:.85}100%{transform:scale(1.5);opacity:0}}
</style>
<rect width="120" height="120" fill="var(--fondo)"/>
<circle class="i5ring" cx="60" cy="58" r="44" fill="none" stroke="var(--aura)" stroke-width="3"/>
<g class="i5f">
<circle cx="60" cy="58" r="42" fill="var(--cara)"/>
<g fill="var(--fondo)">
  <ellipse class="i5eye" cx="45" cy="46" rx="5.4" ry="9"/>
  <ellipse class="i5eye" cx="75" cy="46" rx="5.4" ry="9"/>
  <path d="M33,64a27,27 0 0 0 54,0 6,6 0 0 0-11,0 16,16 0 0 1-32,0 6,6 0 0 0-11,0Z"/>
</g>
</g>
<g fill="var(--cara)">
<path class="i5drip" d="M52,96c0-5 8-5 8,0s-8,5-8,0Z"/>
<path class="i5drip" d="M74,92c0-4.5 7-4.5 7,0s-7,4.5-7,0Z"/>
</g>
<circle cx="60" cy="58" r="42" fill="none" stroke="var(--fondo)" stroke-width="0"/>
</svg>
