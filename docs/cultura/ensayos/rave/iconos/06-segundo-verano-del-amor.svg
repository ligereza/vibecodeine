<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" data-name="06-segundo-verano-del-amor">
<style>
  /* ══ PALETA — edita libremente estos valores ══ */
  svg{
    --papel: #fff3e0;
    --rayo: #ff6b2c;
    --sol: #ffd23f;
    --corazon: #ff2e5b;
    --tinta: #1a1a2e;
    /* ── velocidades (mayor = más lento) ── */
    --vel-latido: 1.15s;
    --vel-rayos: 24s;
    --vel-trazo: 5s;
    --vel-brillo: 2.6s;
  }

.i6rays{transform-origin:60px 56px;animation:i6spin var(--vel-rayos) linear infinite}
@keyframes i6spin{to{transform:rotate(360deg)}}
.i6draw{stroke-dasharray:230;stroke-dashoffset:230;animation:i6d var(--vel-trazo) ease-in-out infinite}
@keyframes i6d{0%{stroke-dashoffset:230}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-230}}
.i6heart{transform-origin:60px 57px;animation:i6beat var(--vel-latido) ease-in-out infinite}
@keyframes i6beat{0%,100%{transform:scale(1)}18%{transform:scale(1.16)}34%{transform:scale(.98)}52%{transform:scale(1.09)}}
.i6r{animation:i6fl var(--vel-brillo) ease-in-out infinite}
@keyframes i6fl{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<rect width="120" height="120" fill="var(--papel)"/>
<g class="i6rays" stroke="var(--rayo)" stroke-width="5" stroke-linecap="round">
  <g class="i6r">
  <path d="M60,8v13M60,91v13M8,56h13M99,56h13M23,19l9,9M88,84l9,9M97,19l-9,9M32,84l-9,9"/>
  </g>
</g>
<circle cx="60" cy="56" r="33" fill="var(--sol)"/>
<path class="i6heart" d="M60,76c-14-9-23-17-23-27a12.5,12.5 0 0 1 23-6.6A12.5,12.5 0 0 1 83,49c0,10-9,18-23,27Z" fill="var(--corazon)"/>
<path class="i6draw" d="M18,102c10-8 20-8 30,0s20,8 30,0 20-8 26,0" fill="none" stroke="var(--tinta)" stroke-width="4.5" stroke-linecap="round"/>
<g font-family="ui-monospace,Menlo,monospace" font-weight="700" font-size="13" fill="var(--tinta)">
  <text x="14" y="24">88</text><text x="88" y="24" text-anchor="middle">89</text>
</g>
</svg>
