<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" data-name="13-spiral-tribe-free-party">
<style>
  /* ══ PALETA — edita libremente estos valores ══ */
  svg{
    --fondo: #000000;
    --resplandor: #12220a;
    --verde: #7dff2e;
    --blanco: #ffffff;
    /* ── velocidades (mayor = más lento) ── */
    --vel-rotacion: 9s;
    --vel-trazo: 7s;
    --vel-pulso: 2.2s;
    --vel-parpadeo: 1.1s;
  }

.i13sp{transform-origin:60px 60px;animation:i13r var(--vel-rotacion) linear infinite}
@keyframes i13r{to{transform:rotate(-360deg)}}
.i13tr{stroke-dasharray:1400;stroke-dashoffset:0;animation:i13d var(--vel-trazo) ease-in-out infinite}
@keyframes i13d{0%,8%{stroke-dashoffset:1400}55%,100%{stroke-dashoffset:0}}
.i13sh{animation:i13f var(--vel-parpadeo) steps(2) infinite}
@keyframes i13f{0%,49%{opacity:.25}50%,100%{opacity:.7}}
.i13ring{transform-origin:60px 60px;animation:i13p var(--vel-pulso) ease-out infinite}
@keyframes i13p{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.35);opacity:0}}
</style>
<rect width="120" height="120" fill="var(--fondo)"/>
<circle class="i13sh" cx="60" cy="60" r="52" fill="var(--resplandor)"/>
<circle class="i13ring" cx="60" cy="60" r="46" fill="none" stroke="var(--verde)" stroke-width="2"/>
<g class="i13sp">
