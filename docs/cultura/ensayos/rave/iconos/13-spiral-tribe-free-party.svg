 fill="none" stroke="var(--verde)" stroke-width="4.6" stroke-linecap="round"/>
</g>
<g fill="none" stroke="var(--blanco)" stroke-width="3" stroke-linecap="round">
<path d="M12,60a12,12 0 0 1 0-14M8,64a17,17 0 0 1 0-22"/>
<path d="M108,60a12,12 0 0 0 0-14M112,64a17,17 0 0 0 0-22"/>
</g>
<g font-family="Impact,'Arial Black',sans-serif" font-size="13" fill="var(--blanco)" letter-spacing="3">
<text x="60" y="112" text-anchor="middle">SPIRAL</text>
</g>
</svg>
