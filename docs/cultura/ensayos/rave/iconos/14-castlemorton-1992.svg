<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" data-name="14-castlemorton-1992">
<style>
  /* ══ PALETA — edita libremente estos valores ══ */
  svg{
    --cielo-alto: #0b1030;
    --cielo-bajo: #3a1a4e;
    --haz: #d7ff2e;
    --luna: #f6f1c9;
    --campo: #132a1c;
    --equipo: #0d0d12;
    --equipo-int: #1a1a22;
    --gente: #8fe0b0;
    /* ── velocidades (mayor = más lento) ── */
    --vel-saltos: 1.05s;
    --vel-haces: 5s;
    --vel-luna: 4s;
    --vel-estrellas: 3s;
  }

.i14b circle{animation:i14j var(--vel-saltos) ease-in-out infinite}
@keyframes i14j{0%,100%{transform:translateY(0)}45%{transform:translateY(-3.5px)}}
.i14beam{transform-origin:60px 34px;animation:i14sc var(--vel-haces) ease-in-out infinite}
.i14beam2{transform-origin:60px 34px;animation:i14sc var(--vel-haces) ease-in-out infinite reverse}
@keyframes i14sc{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(26deg)}}
.i14moon{animation:i14gl var(--vel-luna) ease-in-out infinite}
@keyframes i14gl{0%,100%{opacity:.85}50%{opacity:1}}
.i14st{animation:i14tw var(--vel-estrellas) ease-in-out infinite}
.i14st:nth-of-type(2){animation-delay:.7s}.i14st:nth-of-type(3){animation-delay:1.4s}.i14st:nth-of-type(4){animation-delay:2.1s}
@keyframes i14tw{0%,100%{opacity:.25}50%{opacity:1}}
</style>
<defs><linearGradient id="g14" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--cielo-alto)"/><stop offset="1" stop-color="var(--cielo-bajo)"/></linearGradient>
<linearGradient id="g14b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--haz)" stop-opacity=".7"/><stop offset="1" stop-color="var(--haz)" stop-opacity="0"/></linearGradient></defs>
