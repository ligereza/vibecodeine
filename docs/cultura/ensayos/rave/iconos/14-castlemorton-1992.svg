<circle class="i14moon" cx="94" cy="26" r="9" fill="var(--luna)"/><circle cx="90" cy="23" r="8" fill="var(--cielo-alto)" opacity=".9"/>
<path d="M0,74c18-12 30,2 46-4s28-14 44-8 22,10 30,8v50H0Z" fill="var(--campo)"/>
