                                    <tspan x="10" dy="12">## Operational areas</tspan>
                                    <tspan x="10" dy="12">### RD / Suplementos</tspan>
                                    <tspan x="10" dy="12">Institutional RD work: supplements, quotes, SVG labels/back covers, stand plans,</tspan>
                                    <tspan x="10" dy="12">Spanish: **[`docs/rd/MAPA_RD.md`](docs/rd/MAPA_RD.md)**.</tspan>
                                    <tspan x="10" dy="12">```bash</tspan>
