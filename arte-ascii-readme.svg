                                    <tspan x="10" dy="12">```</tspan>
                                    <tspan x="10" dy="12">## The four branches, and what each one is for</tspan>
                                    <tspan x="10" dy="12">```txt</tspan>
                                    <tspan x="10" dy="12">main EVERYTHING, without exception. The complete, working, verifiable</tspan>
                                    <tspan x="10" dy="12">version. The lines come DOWN from main, never the other way around.</tspan>
                                    <tspan x="10" dy="12">rd The NGO line: Reduciendo Dano. Data, grants, supplements, events.</tspan>
                                    <tspan x="10" dy="12">What the RD people receive is a generated FILE, never this repo --</tspan>
                                    <tspan x="10" dy="12">a branch does not hide history, and anyone cloning it gets every</tspan>
                                    <tspan x="10" dy="12">iskvw The artistic line: curation, archive, portfolio. Its current public</tspan>
                                    <tspan x="10" dy="12">host is transitional; the repo must not depend on that domain forever.</tspan>
                                    <tspan x="10" dy="12">mak NOT a line: it is MAK&#x27;s INBOX. Nothing lives here. The box opens a PR</tspan>
                                    <tspan x="10" dy="12">against it and the only exit is a PR into main. If it ever stops</tspan>
                                    <tspan x="10" dy="12">```</tspan>
                                    <tspan x="10" dy="12">To bring a line up to date: `git merge origin/main`, never a rewrite. A line is</tspan>
                                    <tspan x="10" dy="12">promoted to main by a curated PR with green CI. Work that fits no line gets</tspan>
