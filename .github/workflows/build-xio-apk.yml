name: build-xio-apk
# Builds hotspot_boot_service APK (AccessibilityService reboot-recovery del
# Xiaomi) en runner ubuntu -- esta PC no tiene toolchain Android (Java/SDK).
# Solo manual: gh workflow run build-xio-apk.yml
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: xio/hotspot_boot_service
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hotspot-boot-apk
          path: xio/hotspot_boot_service/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
