name: CI integrated main
permissions:
  contents: read
# main is the reviewed MAK + FLUJO baseline. The lane branches keep their
# own operational CI; this workflow validates the actual integrated tree.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  integrated:
    name: integrated MAK + FLUJO baseline
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install the integrated profile
        run: python -m pip install -r requirements-integration.txt
      - name: pip check
        run: python -m pip check
      - name: Integrated lanes
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest -o addopts='' -q -m "mak or flujo or integration or repo_hygiene"
