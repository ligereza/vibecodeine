name: debug-ig-extract
on:
  push:
    branches: [fix/ig-download-resolution-disclosure]

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: [self-hosted, eventos]
    timeout-minutes: 5
    steps:
      - name: instalar parth-dl si falta
        run: |
          python3 -c "import parth_dl" 2>/dev/null || \
            python3 -m pip install --user --quiet --break-system-packages parth-dl

      - name: extraer y listar candidatos
        env:
          URL: "https://www.instagram.com/p/DdCZODWiI2s/"
        run: |
          python3 - <<'PY'
          import os, json
          from parth_dl import get_info
          from parth_dl.extractors import MediaExtractor

          url = os.environ["URL"]

          # Ver cual metodo gana y que trae CRUDO, no solo el resultado final.
          extractor = MediaExtractor()
          shortcode = None
          from parth_dl.utils import extract_instagram_id
          shortcode = extract_instagram_id(url)
          print("shortcode:", shortcode)

          embed_url = f"https://www.instagram.com/p/{shortcode}/embed/"
          webpage = extractor._make_request(embed_url)
          media = extractor._extract_context_json(webpage)
          if media is None:
              print("EMBED: sin contextJSON")
          else:
              print("EMBED contextJSON media keys:", sorted(media.keys()))
              print("is_video:", media.get("is_video"))
              print("has edge_sidecar_to_children:", "edge_sidecar_to_children" in media)
              sidecar = media.get("edge_sidecar_to_children")
              if sidecar:
                  edges = sidecar.get("edges") or []
                  print("sidecar edges:", len(edges))
                  for j, edge in enumerate(edges):
                      node = edge.get("node", {})
                      dims = node.get("dimensions") or {}
                      print(f"  slide {j}: is_video={node.get('is_video')} "
                            f"dims={dims} display_url_present={'display_url' in node}")
              print("top-level display_url dims:", media.get("dimensions"))
              print("__typename:", media.get("__typename"))

          print()
          print("=== resultado final de get_info ===")
          data = get_info(url)
          print("type:", data.get("type"))
          entries = data.get("entries") or []
          print("num entries:", len(entries))
          for i, e in enumerate(entries):
              print(f"--- entry {i} kind={e.get('kind')} ---")
              for f in (e.get("formats") or []):
                  print(f"  width={f.get('width')} height={f.get('height')}")
          PY
