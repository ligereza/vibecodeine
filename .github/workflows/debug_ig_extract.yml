name: debug-ig-extract
# Diagnostico de un solo uso: imprime TODOS los candidatos (formats) que
# parth_dl encuentra para un link de Instagram, sin descargar ni tocar
# issues. No es parte del pipeline productivo -- se borra despues de usarlo.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link de Instagram a inspeccionar"
        required: true

permissions:
  contents: read

jobs:
  inspeccionar:
    runs-on: [self-hosted, eventos]
    timeout-minutes: 5
    steps:
      - name: instalar parth-dl si falta
        run: |
          python3 -c "import parth_dl" 2>/dev/null || \
            python3 -m pip install --user --quiet --break-system-packages parth-dl

      - name: extraer y listar candidatos
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          python3 - <<'PY'
          import os
          from parth_dl import get_info

          url = os.environ["URL"]
          data = get_info(url)
          print("type:", data.get("type"))
          entries = data.get("entries") or []
          print("num entries:", len(entries))
          for i, e in enumerate(entries):
              print(f"--- entry {i} kind={e.get('kind')} ---")
              for f in (e.get("formats") or []):
                  w = f.get("width")
                  h = f.get("height")
                  aspect = (w / h) if (w and h) else None
                  print(f"  format_id={f.get('format_id')} width={w} height={h} "
                        f"aspect={aspect} has_audio={f.get('has_audio')}")
          print("thumbnail:", data.get("thumbnail"))
          PY
