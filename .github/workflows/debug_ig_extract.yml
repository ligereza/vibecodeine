name: debug-ig-extract
on:
  push:
    branches: [fix/ig-download-resolution-disclosure]

permissions:
  contents: read

jobs:
  probar_descarga:
    runs-on: [self-hosted, eventos]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: descargar con el codigo arreglado y subir a OneDrive para revisar
        run: |
          set -e
          out="$RUNNER_TEMP/prueba_fix"
          mkdir -p "$out"
          URL="https://www.instagram.com/p/DdCZODWiI2s/" OUT="$out" PYTHONPATH=src python3 - <<'PY'
          import json, os
          from pathlib import Path
          from flujo.ig.download import download_post
          out = Path(os.environ["OUT"])
          res = download_post(os.environ["URL"], out)
          print(json.dumps({k: str(v) for k, v in res.items()}, ensure_ascii=False))
          if res.get("status") != "downloaded":
              raise SystemExit(1)
          PY
          find "$out" -type f -exec ls -la {} \;
          rclone copy "$out" "onedrive:MAK/_test/fix-ig-download" --create-empty-src-dirs
          rclone lsl "onedrive:MAK/_test/fix-ig-download"
