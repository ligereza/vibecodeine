# Auditoria de ramas consolidadas, sin poda.
#
# This workflow reports branch provenance only. Branch history is preserved;
# deletion is never performed by GitHub Actions or by this repository.

name: Auditar ramas consolidadas

on:
  workflow_dispatch:
    inputs:
      ramas:
        description: "Ramas a podar, separadas por espacio. Vacio = todas las que ya esten contenidas en main."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  podar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar con historia completa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Revisar y podar
        env:
          RAMAS: ${{ inputs.ramas }}
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          PROTEGIDAS="main"

          if [ -n "${RAMAS// /}" ]; then
            CANDIDATAS="$RAMAS"
          else
            CANDIDATAS=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
              | sed 's|^origin/||' | grep -v '^HEAD$')
          fi

          echo "== Revision =="
          for b in $CANDIDATAS; do
            case " $PROTEGIDAS " in
              *" $b "*) echo "PROTEGIDA   $b -- linea permanente, no se toca"; continue ;;
            esac
            if ! git rev-parse --verify --quiet "origin/$b" >/dev/null; then
              echo "NO EXISTE   $b"
              continue
            fi
            if git merge-base --is-ancestor "origin/$b" origin/main; then
              echo "CONSOLIDADA $b -- todo su contenido esta en main; se conserva"
            else
              n=$(git rev-list --count origin/main.."origin/$b")
              # Una rama puede tener commits propios y aun asi no aportar NADA
              # que main no tenga: pasa cuando su trabajo entro por otro camino
              # (una promocion curada) y lo que le queda son versiones viejas.
              # Distinguir los dos casos es lo que decide si borrarla pierde algo.
              nuevas=0
              for f in $(git diff origin/main..."origin/$b" --name-only); do
                git cat-file -e "origin/main:$f" 2>/dev/null || nuevas=$((nuevas+1))
              done
              if [ "$nuevas" -eq 0 ]; then
                # A squash merge can leave commits that are not ancestors of
                # main. The audit records the state and preserves the branch.
                echo "SE CONSERVA  $b -- $n commit(s) propios, 0 rutas nuevas."
                echo "                  Su contenido parece superado; no se borra."
              else
                echo "SE SALTA    $b -- $n commit(s) propios y $nuevas ruta(s) que NO existen en main."
                echo "                  NO borrar sin revisar que hay ahi."
              fi
            fi
          done

          echo "== Auditoria terminada: no se borraron ramas =="
