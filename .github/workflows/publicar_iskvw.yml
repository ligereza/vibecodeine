# Publishes iskvw to GitHub Pages (iskvw.cl) only after explicit dispatch.
#
# Por que existe. El dominio estaba configurado con certificado HTTPS valido y
# devolvia 404 en TODO, medido el 2026-07-27: Pages esta en modo `workflow` y no
# habia ningun workflow que subiera nada -- los dos que existian se retiraron en
# el PR #341 porque publicaban al repo `portfolio-auto`, que quedo descartado.
# Un dominio configurado que responde un error es peor que un dominio sin sitio.
#
# Que sube. SOLO `iskvw/`, no el repo entero: la piel, sus librerias, el campo
# y los recursos vectoriales permitidos por sus manifiestos. Nada de RD, nada
# de MAK, nada de xio. Las imagenes originales del archivo NO viajan; la
# publicacion sirve solo los recursos que la compuerta de coherencia encuentra
# en el arbol del portfolio.
#
# La piel se verifica con smoke y medicion deterministas antes de publicar. La
# tasa de cuadros de un telefono real no se afirma aqui: debe medirse en el
# aparato, no heredarse de un snapshot antiguo.
name: publicar iskvw

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Publication is explicit and never follows a push.
# `cancel-in-progress: false` avoids leaving a half-deployed site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      # Migration seam: set the repository variable PUBLIC_DOMAIN when the
      # portfolio moves. Until then the historical hostname remains the
      # default without baking it into the deployment logic.
      PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || 'iskvw.cl' }}
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: generar el sustrato (archivo.json)
        run: |
          set -euo pipefail
          # archivo.json is a regenerable projection. The skin asks for it
          # first and falls back to campo.json if missing. Essays are not part
          # of the default public substrate: their iconographic annex is a
          # valid research guarantee, but iskvw.cl must not mix reports and
          # concepts into the artwork archive unless explicitly requested.
          # The generator warns when it cannot reach the micelio (the box is
          # not visible from CI) and continues with repo material; that is
          # expected, not an error.
          python3 tools/gen_archivo_iskvw.py --fuente todo
          test -s iskvw/datos/archivo.json

      - name: armar el sitio
        run: |
          set -euo pipefail
          mkdir -p _sitio
          cp -r iskvw/. _sitio/
          # La raiz lleva a la piel. Sin esto el dominio sigue en 404, que es
          # justo el defecto que este workflow viene a cerrar.
          cp iskvw/piel/campo/index.html _sitio/index.html
          # index.html en la raiz pide sus datos con '../../datos/...' porque
          # vive dos niveles mas abajo. Se reescribe a la raiz en la COPIA, no
          # en el archivo del repo.
          sed -i "s#\.\./\.\./datos/#datos/#g; s#\.\./trazos/#piel/trazos/#g; s#\.\./lib/#piel/lib/#g" _sitio/index.html
          # Jekyll ignora todo lo que empieza con _ , y el indice de trazos se
          # llama _indice.json. Sin esto el sitio pide un archivo que Pages no
          # publica y la consola se llena de 404.
          touch _sitio/.nojekyll
          case "$PUBLIC_DOMAIN" in
            *://*|*/*|.*|*.*.*.*) echo "dominio invalido: $PUBLIC_DOMAIN" >&2; exit 1 ;;
          esac
          printf '%s\n' "$PUBLIC_DOMAIN" > _sitio/CNAME
          # Misma regla para lo que vive DENTRO de iskvw/: el sitio aplana el
          # prefijo (la raiz ES iskvw/), pero el contrato declara rutas de
          # repo (iskvw/piel/...). Se espeja ese prefijo para que el src del
          # contrato sea una URL verdadera. Atrapado por la compuerta de
          # coherencia en el primer deploy con animadas: 219 piezas cuyo svg
          # no era alcanzable.
          for dir_pieza in iskvw/piel/animadas iskvw/piel/laser; do
            [ -d "$dir_pieza" ] || continue
            mkdir -p "_sitio/$dir_pieza"
            cp "$dir_pieza"/*.svg "_sitio/$dir_pieza/" 2>/dev/null || true
          done

      - name: comprobar que lo que se sube existe
        run: |
          set -euo pipefail
          # con contenido
          for f in index.html piel/campo/index.html datos/campo.json \
                   datos/archivo.json piel/trazos/_indice.json CNAME; do
            test -s "_sitio/$f" || { echo "FALTA o vacio: $f"; exit 1; }
          done
          # `.nojekyll` es VACIO por diseño, asi que se comprueba existencia y no
          # tamaño. Con `test -s` este job fallaba -- encontrado simulando el
          # armado en local antes de que corriera en CI.
          test -f _sitio/.nojekyll || { echo "FALTA: .nojekyll"; exit 1; }
          # `find`, no `ls` con glob: el glob no distingue "no hay archivos" de
          # "no pude expandir la ruta".
          # COHERENCIA, no cantidad. Un umbral absoluto de trazos codifica el
          # tamano que el archivo tenia un dia concreto y puede bloquear una
          # publicacion correcta cuando cambia el filtro. La guarda compara el
          # indice, el disco y el campo actual, no un numero historico.
          n=$(find _sitio/piel/trazos -name '*.svg' | wc -l)
          test "$n" -gt 0 || { echo "no hay ningun trazo"; exit 1; }
          # lo que de verdad importa: el indice y el disco dicen lo mismo, y
          # ningun trazo sobra respecto del campo que se publica
          python3 - <<'PY'
          import json, glob, os, sys
          idx = json.load(open("_sitio/piel/trazos/_indice.json", encoding="utf-8"))["trazos"]
          disco = {os.path.basename(f)[:-4] for f in glob.glob("_sitio/piel/trazos/*.svg")}
          campo = json.load(open("_sitio/datos/campo.json", encoding="utf-8"))["piezas"]
          ids = {p["id"].split("-")[0] for p in campo}
          if set(idx) != disco:
              print("el indice y el disco no coinciden:",
                    len(set(idx) ^ disco), "de diferencia"); sys.exit(1)
          sobran = disco - ids
          if sobran:
              print("se publicarian", len(sobran),
                    "trazos de obras que el filtro excluye"); sys.exit(1)
          print("coherente:", len(disco), "trazos, todos del campo publicado")
          PY
          # Every graphic piece in the substrate must have its svg IN the site:
          # today these are animated archive derivatives, not the research
          # essay icons. Research SVGs stay available through the explicit
          # `--fuente ensayos` / `--incluir-ensayos` lane, not by accidental
          # default publication.
          #
          # Toda pieza grafica del sustrato debe tener su svg EN el sitio: un
          # medio.src que 404ea es el contrato afirmando una obra que el
          # visitante no puede ver -- la mentira exacta que el doublecup
          # prohibe. (La piel degrada sin el, pero degradar en silencio para
          # siempre es como se pierden las animaciones sin que nadie lo note.)
          python3 - <<'PY'
          import json, os, sys
          piezas = json.load(open("_sitio/datos/archivo.json", encoding="utf-8"))["piezas"]
          rotos = [p["medio"]["src"] for p in piezas
                   if p.get("clase") == "pieza_grafica"
                   and p.get("medio", {}).get("src")
                   and not os.path.isfile(os.path.join("_sitio", p["medio"]["src"]))]
          if rotos:
              print("piezas graficas sin su svg en el sitio:", len(rotos))
              for r in rotos[:5]: print("  ", r)
              sys.exit(1)
          n = sum(1 for p in piezas if p.get("clase") == "pieza_grafica")
          print(f"svg coherentes: {n} piezas graficas, todas con su svg servido")
          PY
          # Un SVG de 0 bytes es indistinguible de un trazo bueno servido: ese
          # defecto ya paso una vez, 60 archivos vacios en disco.
          vacios=$(find _sitio/piel/trazos -name '*.svg' -size 0 | wc -l)
          test "$vacios" -eq 0 || { echo "$vacios trazos vacios"; exit 1; }
          echo "OK: $n trazos, 0 vacios"
          du -sh _sitio

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _sitio
      - id: desplegar
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
