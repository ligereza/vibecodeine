# Publica iskvw en GitHub Pages (iskvw.cl).
#
# Por que existe. El dominio estaba configurado con certificado HTTPS valido y
# devolvia 404 en TODO, medido el 2026-07-27: Pages esta en modo `workflow` y no
# habia ningun workflow que subiera nada -- los dos que existian se retiraron en
# el PR #341 porque publicaban al repo `portfolio-auto`, que quedo descartado.
# Un dominio configurado que responde un error es peor que un dominio sin sitio.
#
# Que sube. SOLO `iskvw/`, no el repo entero: la piel, sus librerias, los datos
# del campo y los 649 trazos vectoriales. Nada de RD, nada de MAK, nada de xio.
# Las imagenes originales del archivo NO viajan (1,6 GB); lo que viaja es el
# trazo, que es exactamente para lo que se hizo: 4,9 MB para 649 obras, y el
# visitante baja solo la obra donde freno.
#
# Verificado antes de existir: la piel corre a 60 fps con 697 nodos en telefono
# parado, acostado, chico, tablet y escritorio, con CPU estrangulada y densidad
# 3, cero errores de consola en los cinco.
name: publicar iskvw

on:
  push:
    branches: [main]
    paths:
      - 'iskvw/**'
      - '.github/workflows/publicar_iskvw.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` a proposito: cancelar un
# deploy a medias puede dejar el sitio en un estado que nadie eligio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: generar el sustrato (archivo.json)
        run: |
          set -euo pipefail
          # archivo.json esta gitignoreado: es una proyeccion regenerable. La
          # piel lo pide primero y cae a campo.json si falta. Sin este paso el
          # sitio publicado nunca lo llevaba, asi que los ensayos de MAK y sus
          # vinculos no llegaban al campo: la mitad de #403 que no se publico.
          # El generador avisa que no alcanza el micelio (la caja no es
          # visible desde CI) y sigue con el material del repo: eso es lo
          # esperado, no un error.
          python3 tools/gen_archivo_iskvw.py --fuente todo
          test -s iskvw/datos/archivo.json

      - name: armar el sitio
        run: |
          set -euo pipefail
          mkdir -p _sitio
          cp -r iskvw/. _sitio/
          # La raiz lleva a la piel. Sin esto el dominio sigue en 404, que es
          # justo el defecto que este workflow viene a cerrar.
          cp iskvw/piel/campo/index.html _sitio/index.html
          # index.html en la raiz pide sus datos con '../../datos/...' porque
          # vive dos niveles mas abajo. Se reescribe a la raiz en la COPIA, no
          # en el archivo del repo.
          sed -i "s#\.\./\.\./datos/#datos/#g; s#\.\./trazos/#piel/trazos/#g; s#\.\./lib/#piel/lib/#g" _sitio/index.html
          # Jekyll ignora todo lo que empieza con _ , y el indice de trazos se
          # llama _indice.json. Sin esto el sitio pide un archivo que Pages no
          # publica y la consola se llena de 404.
          touch _sitio/.nojekyll
          echo "iskvw.cl" > _sitio/CNAME
          # Los iconos animados de los ensayos: el sustrato los declara como
          # piezas (medio.src con la ruta del repo) y la piel los presenta al
          # quedarse quieto. Viajan con su ruta de repo INTACTA -- asi el
          # contrato no miente y no hay reescritura que mantener.
          for dir_ensayo in docs/cultura/ensayos/*/iconos; do
            [ -d "$dir_ensayo" ] || continue
            mkdir -p "_sitio/$dir_ensayo"
            cp "$dir_ensayo"/*.svg "_sitio/$dir_ensayo/" 2>/dev/null || true
          done

      - name: comprobar que lo que se sube existe
        run: |
          set -euo pipefail
          # con contenido
          for f in index.html piel/campo/index.html datos/campo.json \
                   datos/archivo.json piel/trazos/_indice.json CNAME; do
            test -s "_sitio/$f" || { echo "FALTA o vacio: $f"; exit 1; }
          done
          # `.nojekyll` es VACIO por diseño, asi que se comprueba existencia y no
          # tamaño. Con `test -s` este job fallaba -- encontrado simulando el
          # armado en local antes de que corriera en CI.
          test -f _sitio/.nojekyll || { echo "FALTA: .nojekyll"; exit 1; }
          # `find`, no `ls` con glob: el glob no distingue "no hay archivos" de
          # "no pude expandir la ruta".
          # COHERENCIA, no cantidad. El umbral que habia aca -- "mas de 600
          # trazos" -- codificaba el tamano que el archivo tenia ese dia, y
          # cuando el usuario lo restringio a `posts` quedaron 208: la guarda
          # bloqueo la publicacion CORRECTA y dejo viva la anterior, que
          # justamente traia el material que se habia sacado por privacidad.
          # Un umbral absoluto convierte un cambio legitimo de alcance en un
          # despliegue fallido, y encima falla del lado inseguro.
          n=$(find _sitio/piel/trazos -name '*.svg' | wc -l)
          test "$n" -gt 0 || { echo "no hay ningun trazo"; exit 1; }
          # lo que de verdad importa: el indice y el disco dicen lo mismo, y
          # ningun trazo sobra respecto del campo que se publica
          python3 - <<'PY'
          import json, glob, os, sys
          idx = json.load(open("_sitio/piel/trazos/_indice.json", encoding="utf-8"))["trazos"]
          disco = {os.path.basename(f)[:-4] for f in glob.glob("_sitio/piel/trazos/*.svg")}
          campo = json.load(open("_sitio/datos/campo.json", encoding="utf-8"))["piezas"]
          ids = {p["id"].split("-")[0] for p in campo}
          if set(idx) != disco:
              print("el indice y el disco no coinciden:",
                    len(set(idx) ^ disco), "de diferencia"); sys.exit(1)
          sobran = disco - ids
          if sobran:
              print("se publicarian", len(sobran),
                    "trazos de obras que el filtro excluye"); sys.exit(1)
          print("coherente:", len(disco), "trazos, todos del campo publicado")
          PY
          # Toda pieza grafica del sustrato debe tener su svg EN el sitio: un
          # medio.src que 404ea es el contrato afirmando una obra que el
          # visitante no puede ver -- la mentira exacta que el doublecup
          # prohibe. (La piel degrada sin el, pero degradar en silencio para
          # siempre es como se pierden las animaciones sin que nadie lo note.)
          python3 - <<'PY'
          import json, os, sys
          piezas = json.load(open("_sitio/datos/archivo.json", encoding="utf-8"))["piezas"]
          rotos = [p["medio"]["src"] for p in piezas
                   if p.get("clase") == "pieza_grafica"
                   and p.get("medio", {}).get("src")
                   and not os.path.isfile(os.path.join("_sitio", p["medio"]["src"]))]
          if rotos:
              print("piezas graficas sin su svg en el sitio:", len(rotos))
              for r in rotos[:5]: print("  ", r)
              sys.exit(1)
          n = sum(1 for p in piezas if p.get("clase") == "pieza_grafica")
          print(f"iconos coherentes: {n} piezas graficas, todas con su svg servido")
          PY
          # Un SVG de 0 bytes es indistinguible de un trazo bueno servido: ese
          # defecto ya paso una vez, 60 archivos vacios en disco.
          vacios=$(find _sitio/piel/trazos -name '*.svg' -size 0 | wc -l)
          test "$vacios" -eq 0 || { echo "$vacios trazos vacios"; exit 1; }
          echo "OK: $n trazos, 0 vacios"
          du -sh _sitio

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _sitio
      - id: desplegar
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
