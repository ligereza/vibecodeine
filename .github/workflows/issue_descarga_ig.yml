name: issue-descarga-ig
# Flujo evento-driven: Apps Script (Gmail 8h) crea issue label "instagram"
# -> este workflow corre EN MAK (runner self-hosted) -> descarga la imagen o
# el video real del link IG -> render Blender headless (sin Photoshop)
# -> publicacion directa a OneDrive + comentario + cierre del issue.
# Seguridad: procesa un issue solo al abrirse con la etiqueta de accion, o
# cuando se agrega especificamente "action/descargar-ig"; agregar cualquier
# otra etiqueta no vuelve a renderizarlo. El body/titulo del issue entran SOLO
# via env (nunca
# interpolados en un comando shell).
#
# META-REGLA render: el gate foreground de MAK fue validado el 2026-08-15
# con un flyer real (1080x1920, salida no monocromatica). El camino evento
# ejecuta render_flyer_mak.py para imagenes y render_video_sequence_mak.py
# para reels. El issue solo se cierra despues de render + upload exitosos.
# El barrido manual permanece conservador y no reprocesa historicos en masa.
#
# Barrido auto-sanador: ademas del evento issues, corre cada 30 min
# (schedule) y a mano (workflow_dispatch). En esos disparos NO hay un
# issue "propio": lista los abiertos con label action/descargar-ig sin
# comentario de render OK todavia y los procesa uno por uno (reintenta
# los que fallaron antes; nunca reprocesa uno ya cerrado con exito).
# Guard anti-eco: el intake Gmail tambien crea issues desde notificaciones
# de GitHub ("Re: [repo] ..."), a veces con prefijo de area del intake
# delante ("[EVENTOS] Re: ..." -- ver issue #222) -- esos se saltan SIEMPRE
# sin comentar, en ambos caminos (evento y barrido), para no entrar en
# bucle. El regex tolera un prefijo "[algo] " opcional antes de "Re:".

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

# BARRIDO AUTOMATICO RETIRADO (2026-07-26, orden del usuario: "ese cron y esas
# notificaciones son useless"). Causa medida: el barrido corria cada 30 min y
# volvia a comentar en los issues abiertos; desde #248 el issue ya no se cierra,
# asi que la combinacion era un chorro permanente de comentarios -> GitHub le
# mandaba un aviso por mail a cada uno -> el Apps Script de Gmail convertia cada
# aviso en un issue nuevo. Ese bucle no existia antes del 2026-07-22, que es
# cuando se creo este workflow (f5e6048). El guard anti-eco de abajo evita
# PROCESARLOS, pero no evitaba que se crearan.
# El barrido sigue disponible a mano con workflow_dispatch.
# Retiro de esta regla: cuando el render de MAK pase la verificacion de varianza
# y el issue vuelva a cerrarse solo, el barrido deja de generar ruido y puede
# volver a programarse.

permissions:
  issues: write
  contents: read

concurrency:
  group: descarga-ig-${{ github.event.issue.number || 'barrido' }}
  cancel-in-progress: false

jobs:
  descarga:
    if: >
      (github.event_name == 'issues' &&
       (github.event.action == 'opened' || github.event.label.name == 'action/descargar-ig') &&
       contains(github.event.issue.labels.*.name, 'action/descargar-ig')) ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, eventos]
    timeout-minutes: 30
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUM: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # === camino evento: procesa SOLO el issue que disparo el workflow ===

      - name: chequear anti-eco (issue evento)
        id: guard
        if: github.event_name == 'issues'
        run: |
          set -e
          if printf '%s' "$ISSUE_TITLE" | grep -qE '^(\[[^]]+\] )?Re:'; then
            echo "issue #$ISSUE_NUM: titulo empieza con 'Re:' (eco de notificacion de Gmail), salteado sin comentar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: descargar media del issue
        id: dl
        if: github.event_name == 'issues' && steps.guard.outputs.skip != 'true'
        run: |
          set -e
          url=$(printf '%s' "$ISSUE_BODY" | grep -oE 'https://www\.instagram\.com/[^ )">]+' | head -1)
          if [ -z "$url" ]; then
            gh issue comment "$ISSUE_NUM" -R "$GITHUB_REPOSITORY" \
              -b "runner MAK: issue sin link de instagram detectable."
            exit 1
          fi
          echo "url encontrada (no se imprime completa por higiene de logs)"
          python3 -c "import parth_dl" 2>/dev/null || \
            python3 -m pip install --user --quiet --break-system-packages parth-dl
          out="$RUNNER_TEMP/ig_issue_$ISSUE_NUM"
          mkdir -p "$out"
          URL="$url" OUT="$out" PYTHONPATH=src python3 - <<'PY'
          import json, os
          from pathlib import Path
          from flujo.ig.download import download_post
          out = Path(os.environ["OUT"])
          res = download_post(os.environ["URL"], out)
          (out / "media.json").write_text(
              json.dumps({k: str(v) for k, v in res.items()}, ensure_ascii=False),
              encoding="utf-8",
          )
          print(json.dumps({k: str(v) for k, v in res.items()}, ensure_ascii=False))
          if res.get("status") != "downloaded":
              raise SystemExit(1)
          PY
          n=$(find "$out" -type f | wc -l)
          echo "archivos descargados: $n"
          test "$n" -gt 0
          video=$(find "$out" -maxdepth 1 -type f -name 'input_ig*.mp4' -print -quit)
          media_type=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("media_type", ""))' "$out/media.json")
          shortcode=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("shortcode", ""))' "$out/media.json")
          echo "video=$video" >> "$GITHUB_OUTPUT"
          echo "media_type=$media_type" >> "$GITHUB_OUTPUT"
          echo "shortcode=$shortcode" >> "$GITHUB_OUTPUT"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          # Que slide renderizar: Instagram pone ?img_index=N en el link
          # cuando alguien comparte esa imagen puntual del carrusel
          # (download_post ya lo lee y lo deja en media.json). Default: la
          # primera. Si se pidio otra y no existe, se usa la primera de
          # todos modos (mejor un flyer que ninguno) y se avisa, nunca en
          # silencio -- mismo criterio que eventos/flyer_auto.py.
          indice_pedido=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("requested_image_index", "1"))' "$out/media.json")
          indice_disponible=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("requested_image_index_available", "True"))' "$out/media.json")
          aviso_indice=""
          if [ "$indice_disponible" = "True" ] && [ "$indice_pedido" != "1" ]; then
            nombre_imagen="input_ig_${indice_pedido}.jpg"
          else
            nombre_imagen="input_ig.jpg"
            if [ "$indice_pedido" != "1" ]; then
              aviso_indice=" AVISO: el link pedia la imagen ${indice_pedido} del carrusel pero el post no la tiene; se uso la primera."
            fi
          fi
          imagen=$(find "$out" -maxdepth 1 -type f -name "$nombre_imagen" -print -quit)
          echo "imagen=$imagen" >> "$GITHUB_OUTPUT"
          echo "aviso_indice=$aviso_indice" >> "$GITHUB_OUTPUT"
          # Resolucion real de lo que Instagram entrego (no lo que pedimos):
          # el metodo de extraccion que hoy funciona sin sesion (embed page,
          # ver parth_dl/extractors.py MediaExtractor.extract, "Embed" primero
          # porque API y GraphQL directos devuelven 403/sesion requerida) no
          # garantiza el aspect ratio original -- puede entregar un
          # display_url ya recortado por Instagram. No lo detectamos como
          # error (no hay forma confiable de saber "cuadrado real" vs
          # "cuadrado recortado" sin ver el post), pero SI lo hacemos visible
          # en el comentario de cierre para que un humano lo note antes de
          # confiar en el flyer.
          if [ -n "$imagen" ] && [ -s "$imagen" ]; then
            imagen_wh=$(python3 -c 'from PIL import Image; import sys; w,h = Image.open(sys.argv[1]).size; print(f"{w}x{h}")' "$imagen")
            echo "imagen_wh=$imagen_wh" >> "$GITHUB_OUTPUT"
          fi

      - name: leer productora y fecha con OCR (para nombre del archivo)
        id: nombre_ocr
        if: >
          github.event_name == 'issues' &&
          steps.guard.outputs.skip != 'true' &&
          steps.dl.outcome == 'success'
        env:
          IMAGEN: ${{ steps.dl.outputs.imagen }}
          MEDIA_TYPE: ${{ steps.dl.outputs.media_type }}
        run: |
          set -uo pipefail
          # El OCR corre sobre la imagen DESCARGADA, no sobre el render (el
          # render todavia no existe en este punto del workflow) -- por eso
          # este paso va antes de "render flyer", no despues. Es la misma
          # vision (percepcion.py + gemma3:4b via ollama) que despues vuelve
          # a correr el cron async sobre RD/desde_issues para la ficha
          # oficial; esta corrida aca es SOLO para tener un nombre de
          # archivo con productora+fecha desde el primer guardado, nunca
          # bloqueante -- si falla o no hay nada legible, el paso siguiente
          # cae al nombre issueN-shortcode de siempre.
          python3 - <<'PY'
          import os
          import sys

          imagen = os.environ.get("IMAGEN", "")
          media_type = os.environ.get("MEDIA_TYPE", "")
          nombre_ocr = ""
          productora_ocr = ""
          fecha_ocr = ""

          if imagen and os.path.isfile(imagen) and media_type in ("image", "carousel"):
              try:
                  sys.path.insert(0, "cultura/mak_curatoria")
                  sys.path.insert(0, "cultura/mak_plataforma")
                  import percepcion
                  import mineria_rd
                  import extraccion_db
                  resultado = percepcion.vision_imagen(imagen, timeout=90, fuente="rd")
                  if not resultado.get("error"):
                      fecha_ocr = extraccion_db.valor_limpio(resultado.get("fecha"))
                      crudo = extraccion_db.valor_limpio(resultado.get("productora"))
                      # El campo "productora" casi siempre sale pegado a
                      # auspiciadores ("Picnic Electronik Santiago, Banco de
                      # Chile, e) entel" -- medido 2026-09-09 contra esta
                      # misma imagen real): mejor_match ya sabe segmentar
                      # por coma/presenta/etc y preferir el segmento que
                      # matchea el catalogo real, asi el nombre de archivo
                      # usa el nombre canonico limpio (o el crudo tal cual
                      # si es una productora genuinamente nueva) en vez del
                      # string mezclado completo.
                      if crudo and not extraccion_db.es_identidad_propia(crudo):
                          catalogo = extraccion_db.cargar_catalogo_productoras()
                          canonico, ratio = extraccion_db.mejor_match(crudo, catalogo)
                          clase = extraccion_db.clasificar_ratio(ratio)
                          productora_ocr = (
                              canonico if clase in ("match", "dudoso") and canonico
                              else crudo)
                      if productora_ocr and fecha_ocr:
                          nombre_ocr = "%s__%s" % (
                              mineria_rd._slug(productora_ocr),
                              mineria_rd._slug(fecha_ocr))
              except Exception as exc:
                  print("OCR para nombre fallo (no bloqueante): %s" % exc,
                        file=sys.stderr)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("nombre_ocr=%s\n" % nombre_ocr)
          print("nombre_ocr=%r productora=%r fecha=%r"
                % (nombre_ocr, productora_ocr, fecha_ocr))
          PY

      - name: preservar media descargada antes de render
        id: preserve
        if: >
          github.event_name == 'issues' &&
          steps.guard.outputs.skip != 'true' &&
          steps.dl.outcome == 'success'
        env:
          DOWNLOAD_DIR: ${{ steps.dl.outputs.dir }}
          VIDEO_PATH: ${{ steps.dl.outputs.video }}
          IMAGE_PATH: ${{ steps.dl.outputs.imagen }}
          MEDIA_TYPE: ${{ steps.dl.outputs.media_type }}
        run: |
          set -euo pipefail
          # Dos nubes, no una: onedrive es donde vive el pipeline hoy,
          # gdrive es donde el usuario ya mira por costumbre (el puente
          # viejo -- puente_issues.py -- usaba gdrive por defecto). Mismo
          # contenido a las dos, ninguna es "la buena": si una falla, la
          # otra igual entrega.
          for remoto in onedrive gdrive; do
            destino="${remoto}:MAK/eventos/issue-$ISSUE_NUM"
            if [ "${MEDIA_TYPE:-}" = "video" ]; then
              test -s "${VIDEO_PATH:-}"
              rclone copyto "$VIDEO_PATH" "$destino/input_ig.mp4" \
                --retries 3 --low-level-retries 10 --stats-one-line
              if test -s "${IMAGE_PATH:-}"; then
                rclone copyto "$IMAGE_PATH" "$destino/input_ig.jpg" \
                  --retries 3 --low-level-retries 10 --stats-one-line
              fi
            elif [ "${MEDIA_TYPE:-}" = "image" ] || [ "${MEDIA_TYPE:-}" = "carousel" ]; then
              test -s "${IMAGE_PATH:-}"
              rclone copyto "$IMAGE_PATH" "$destino/input_ig.jpg" \
                --retries 3 --low-level-retries 10 --stats-one-line
            else
              echo "UNKNOWN_MEDIA_TYPE: no se preserva una descarga no clasificada."
              exit 1
            fi
            for extra in media.json ig_caption.txt; do
              if test -s "$DOWNLOAD_DIR/$extra"; then
                rclone copyto "$DOWNLOAD_DIR/$extra" "$destino/$extra" \
                  --retries 3 --low-level-retries 10 --stats-one-line
              fi
            done
            rclone lsf "$destino" --files-only
          done
          echo "destino=onedrive:MAK/eventos/issue-$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          echo "destino_gdrive=gdrive:MAK/eventos/issue-$ISSUE_NUM" >> "$GITHUB_OUTPUT"

      # --- render Blender MAK: habilitado tras gate foreground 2026-08-15 ---

      - name: render flyer (Blender MAK)
        id: render
        if: github.event_name == 'issues' && steps.guard.outputs.skip != 'true'
        env:
          DOWNLOAD_DIR: ${{ steps.dl.outputs.dir }}
          VIDEO_PATH: ${{ steps.dl.outputs.video }}
          IMAGE_PATH: ${{ steps.dl.outputs.imagen }}
          MEDIA_TYPE: ${{ steps.dl.outputs.media_type }}
        run: |
          set -euo pipefail
          outdir="$RUNNER_TEMP/render_issue_$ISSUE_NUM"
          mkdir -p "$outdir"
          echo "dir=$outdir" >> "$GITHUB_OUTPUT"
          if [ "${MEDIA_TYPE:-}" = "video" ]; then
            if [ -z "${VIDEO_PATH:-}" ] || ! test -s "$VIDEO_PATH"; then
              echo "VIDEO_MEDIA_WITHOUT_MP4: Instagram reporto video pero no existe input_ig.mp4; no se usara el poster."
              exit 1
            fi
            issue_flow=$(python3 tools/render_video_sequence_mak.py \
              --video "$VIDEO_PATH" --classify-only)
            case "$issue_flow" in
              video_portrait_9_16)
                echo "media=video portrait=9:16 layout=fitwidth_fade"
                ;;
              video_other_aspect)
                echo "media=video other-aspect layout=fitwidth_fade"
                ;;
              *)
                echo "VIDEO_FLOW_UNKNOWN: $issue_flow"
                exit 1
                ;;
            esac
            echo "issue_flow=$issue_flow" >> "$GITHUB_OUTPUT"
            python3 tools/render_video_sequence_mak.py \
              --video "$VIDEO_PATH" \
              --out-dir "$outdir/frames" \
              2>&1 | tee "$outdir/render.log"
            grep -q '^RENDER_OK:' "$outdir/render.log"
            test -s "$outdir/render_manifest.json"
            find "$outdir/frames" -type f -name 'frame_*.png' -size +0c | grep -q .
          elif [ "${MEDIA_TYPE:-}" = "image" ] || [ "${MEDIA_TYPE:-}" = "carousel" ]; then
            test -n "${IMAGE_PATH:-}"
            test -s "$IMAGE_PATH"
            echo "media=image"
            python3 tools/render_flyer_mak.py \
              --imagen "$IMAGE_PATH" \
              --out "$outdir" \
              2>&1 | tee "$outdir/render.log"
            grep -q '^RENDER_OK:' "$outdir/render.log"
            test -s "$outdir/render_output.png"
          else
            echo "UNKNOWN_MEDIA_TYPE: no se renderiza sin una clasificacion explicita."
            exit 1
          fi

      - name: publicar render en OneDrive (completo o parcial)
        id: publish
        if: >
          always() &&
          github.event_name == 'issues' &&
          steps.guard.outputs.skip != 'true' &&
          steps.dl.outcome == 'success'
        env:
          DOWNLOAD_DIR: ${{ steps.dl.outputs.dir }}
          RENDER_DIR: ${{ steps.render.outputs.dir }}
          VIDEO_PATH: ${{ steps.dl.outputs.video }}
          IMAGE_PATH: ${{ steps.dl.outputs.imagen }}
          MEDIA_TYPE: ${{ steps.dl.outputs.media_type }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
        run: |
          set -euo pipefail
          # Copia a las dos nubes; la validacion (que realmente haya llegado
          # bien) se hace solo contra onedrive, la misma que ya validaba
          # antes de agregar gdrive -- si gdrive tiene un hipo transitorio
          # no se cae el render por eso, onedrive ya entrego.
          for remoto in onedrive gdrive; do
            destino="${remoto}:MAK/eventos/issue-$ISSUE_NUM"
            if [ "${MEDIA_TYPE:-}" = "video" ]; then
              if [ -d "$RENDER_DIR/frames" ] && find "$RENDER_DIR/frames" \
                  -type f -name 'frame_*.png' -size +0c | grep -q .; then
                rclone copy "$RENDER_DIR/frames" "$destino/frames" \
                  --retries 3 --low-level-retries 10 --stats-one-line
              fi
              for artifact in render_manifest.json render.log; do
                if test -s "$RENDER_DIR/$artifact"; then
                  rclone copyto "$RENDER_DIR/$artifact" "$destino/$artifact" \
                    --retries 3 --low-level-retries 10 --stats-one-line
                fi
              done
            elif [ "${MEDIA_TYPE:-}" = "image" ] || [ "${MEDIA_TYPE:-}" = "carousel" ]; then
              if test -s "$RENDER_DIR/render_output.png"; then
                rclone copyto "$RENDER_DIR/render_output.png" \
                  "$destino/render_output.png" \
                  --retries 3 --low-level-retries 10 --stats-one-line
              fi
            else
              echo "UNKNOWN_MEDIA_TYPE: no se publican salidas sin clasificacion."
              exit 1
            fi
          done
          destino="onedrive:MAK/eventos/issue-$ISSUE_NUM"
          if [ "${MEDIA_TYPE:-}" = "video" ]; then
            rclone lsf "$destino" --files-only | grep -qx 'input_ig.mp4'
            if [ "$RENDER_OUTCOME" = "success" ]; then
              rclone lsf "$destino/frames" --files-only | grep -q 'frame_'
              rclone lsf "$destino" --files-only | grep -qx 'render_manifest.json'
            fi
          else
            rclone lsf "$destino" --files-only | grep -qx 'input_ig.jpg'
            if [ "$RENDER_OUTCOME" = "success" ]; then
              rclone lsf "$destino" --files-only | grep -qx 'render_output.png'
            fi
          fi
          echo "destino=$destino" >> "$GITHUB_OUTPUT"
          if [ "$RENDER_OUTCOME" = "success" ]; then
            echo "RENDER_PUBLISH_OK: salida completa publicada en $destino"
          else
            echo "RENDER_PARTIAL_PUBLISH_OK: media y artefactos disponibles publicados en $destino"
          fi

      - name: guardar copia local en RD (fuente + render)
        if: >
          always() &&
          github.event_name == 'issues' &&
          steps.guard.outputs.skip != 'true' &&
          steps.dl.outcome == 'success'
        env:
          SHORTCODE: ${{ steps.dl.outputs.shortcode }}
          IMAGE_PATH: ${{ steps.dl.outputs.imagen }}
          MEDIA_TYPE: ${{ steps.dl.outputs.media_type }}
          RENDER_DIR: ${{ steps.render.outputs.dir }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          NOMBRE_OCR: ${{ steps.nombre_ocr.outputs.nombre_ocr }}
        run: |
          set -euo pipefail
          # Copia local en RD, separada de OneDrive, para dos consumidores
          # distintos que solo leen disco:
          # - RD/desde_issues: la fuente, la percepcion
          #   (~/cultura/mak_curatoria/percepcion.py, OCR + Gemma3:4b via
          #   ollama) la vuelve a levanta en su proxima pasada para la
          #   ficha oficial -- es el unico dato de donde sale la
          #   triangulacion headliner+fecha -> productora que alimenta la
          #   base de RD.
          # - RD/renders_issues: el flyer terminado. Separado a proposito:
          #   la percepcion solo necesita el original, no el mismo evento
          #   dos veces con marco decorativo encima.
          # No se publica la ruta local en el comentario del issue (el
          # issue es publico; ver la nota de puente_issues.py sobre nunca
          # exponer rutas de disco ahi).
          #
          # Nombre: productora+fecha (2026-09-09, pedido explicito) cuando
          # el paso "leer productora y fecha con OCR" pudo leerlos de la
          # imagen descargada; issue<N>-<shortcode> (esquema historico de
          # puente_issues.py) si el OCR no encontro nada legible o fallo --
          # nunca se bloquea el guardado por esto.
          if [ -n "${NOMBRE_OCR:-}" ]; then
            nombre="${NOMBRE_OCR}__issue${ISSUE_NUM}"
          else
            nombre="issue${ISSUE_NUM}-${SHORTCODE}"
          fi
          if [ -n "${IMAGE_PATH:-}" ] && [ -s "$IMAGE_PATH" ]; then
            mkdir -p "$HOME/RD/desde_issues"
            cp "$IMAGE_PATH" "$HOME/RD/desde_issues/${nombre}.jpg"
            echo "fuente guardada en RD/desde_issues/${nombre}.jpg"
          fi
          if [ "${MEDIA_TYPE:-}" != "video" ] && [ "$RENDER_OUTCOME" = "success" ] \
              && [ -s "${RENDER_DIR:-}/render_output.png" ]; then
            mkdir -p "$HOME/RD/renders_issues"
            cp "$RENDER_DIR/render_output.png" "$HOME/RD/renders_issues/${nombre}.png"
            echo "render guardado en RD/renders_issues/${nombre}.png"
          fi

      - name: avisar en pantalla (MAK corre en la misma maquina)
        if: steps.render.outcome == 'success'
        env:
          SHORTCODE: ${{ steps.dl.outputs.shortcode }}
        run: |
          # El runner es un servicio systemd sin sesion grafica propia; se le
          # pasan DISPLAY/DBUS_SESSION_BUS_ADDRESS de la sesion gnome real
          # (unico usuario/escritorio en esta maquina) para que notify-send
          # entregue en la pantalla de MAK, no a la nada. Si el paquete no
          # esta instalado o no hay sesion activa, no se rompe el render por
          # esto -- es un aviso, no el resultado.
          command -v notify-send >/dev/null 2>&1 || exit 0
          DISPLAY=:0 DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/1000/bus" \
            notify-send "MAK · render listo" \
            "issue #$ISSUE_NUM ($SHORTCODE): flyer renderizado y publicado" \
            -i dialog-information || true

      - name: comentar render OK y cerrar issue
        if: steps.render.outcome == 'success' && steps.publish.outcome == 'success'
        env:
          MEDIA_TYPE: ${{ steps.dl.outputs.media_type }}
          IMAGEN_WH: ${{ steps.dl.outputs.imagen_wh }}
          AVISO_INDICE: ${{ steps.dl.outputs.aviso_indice }}
        run: |
          aviso_resolucion=""
          if [ "${MEDIA_TYPE:-}" != "video" ] && [ -n "${IMAGEN_WH:-}" ]; then
            aviso_resolucion=" Imagen de origen: ${IMAGEN_WH}px (resolucion real entregada por Instagram via el metodo de extraccion que hoy responde sin sesion; si el post original no es de esa proporcion, puede llegar recortado -- revisar antes de publicar)."
          fi
          gh issue comment "$ISSUE_NUM" -R "$GITHUB_REPOSITORY" \
            -b "runner MAK: render OK y publicado en OneDrive (\`${{ steps.publish.outputs.destino }}\`).${aviso_resolucion}${AVISO_INDICE:-} Run de control: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue close "$ISSUE_NUM" -R "$GITHUB_REPOSITORY"

      - name: comentar render fallido con media preservada
        if: >
          failure() &&
          github.event_name == 'issues' &&
          steps.guard.outputs.skip != 'true' &&
          steps.dl.outcome == 'success' &&
          steps.render.outcome == 'failure' &&
          steps.preserve.outcome == 'success' &&
          steps.publish.outcome == 'success'
        run: |
          gh issue comment "$ISSUE_NUM" -R "$GITHUB_REPOSITORY" \
            -b "runner MAK: render FALLO, pero la media original y los artefactos parciales fueron preservados en OneDrive (\`${{ steps.publish.outputs.destino }}\`). El issue queda abierto para reintento."

      - name: comentar fallo de descarga
        if: failure() && github.event_name == 'issues' && steps.guard.outputs.skip != 'true' && steps.dl.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE_NUM" -R "$GITHUB_REPOSITORY" \
            -b "runner MAK: descarga FALLO en run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID -- revisar log; issue sigue abierto."

      - name: comentar fallo de render o publicacion
        if: >
          failure() && github.event_name == 'issues' &&
          steps.guard.outputs.skip != 'true' &&
          (steps.render.outcome == 'failure' || steps.publish.outcome == 'failure')
        run: |
          detalle="render=${{ steps.render.outcome }}, publicacion=${{ steps.publish.outcome }}"
          gh issue comment "$ISSUE_NUM" -R "$GITHUB_REPOSITORY" \
            -b "runner MAK: $detalle en run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID -- descarga conservada, issue sigue abierto."

      # === camino barrido: schedule / workflow_dispatch, N issues pendientes ===

      - name: listar issues pendientes (barrido)
        id: listar
        if: github.event_name != 'issues'
        run: |
          set -e
          nums=$(gh issue list -R "$GITHUB_REPOSITORY" --label action/descargar-ig --state open --json number,labels --jq '.[] | select([.labels[].name] | contains(["estado/pendiente-datos"]) | not) | .number' --limit 50 | tr '\n' ' ')
          echo "issues candidatos (label, abiertos, sin pendiente-datos): $nums"
          echo "nums=$nums" >> "$GITHUB_OUTPUT"

      - name: procesar issues pendientes (barrido)
        id: barrido
        if: github.event_name != 'issues'
        run: |
          set -e
          python3 -c "import parth_dl" 2>/dev/null || \
            python3 -m pip install --user --quiet --break-system-packages parth-dl
          barrido_dir="$RUNNER_TEMP/barrido_$GITHUB_RUN_ID"
          mkdir -p "$barrido_dir"
          for n in ${{ steps.listar.outputs.nums }}; do
            echo "--- issue #$n ---"
            titulo=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json title --jq '.title')
            case "$titulo" in
              Re:*|\[*\]\ Re:*)
                echo "issue #$n: titulo empieza con 'Re:' (eco), salteado sin comentar."
                continue
                ;;
            esac
            ya_ok=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body] | any(contains("runner MAK: render OK")) or any(contains("descarga OK"))')
            if [ "$ya_ok" = "true" ]; then
              echo "issue #$n: ya tiene comentario de render OK o descarga OK (render MAK OFF), salteado."
              continue
            fi
            body=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json body --jq '.body')
            url=$(printf '%s' "$body" | grep -oE 'https://www\.instagram\.com/[^ )">]+' | head -1)
            if [ -z "$url" ]; then
              echo "issue #$n: sin link de instagram detectable, salteado sin comentar."
              continue
            fi
            out="$barrido_dir/issue_$n"
            mkdir -p "$out"
            if ! URL="$url" OUT="$out" PYTHONPATH=src python3 - <<'PY'
          import json, os
          from pathlib import Path
          from flujo.ig.download import download_post
          res = download_post(os.environ["URL"], Path(os.environ["OUT"]))
          print(json.dumps({k: str(v) for k, v in res.items()}, ensure_ascii=False))
          if res.get("status") != "downloaded":
              raise SystemExit(1)
          PY
            then
              fallos=$(gh issue view "$n" -R "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | select(contains("descarga FALLO"))] | length')
              if [ "$fallos" -ge 1 ]; then
                gh issue edit "$n" -R "$GITHUB_REPOSITORY" --add-label "estado/pendiente-datos"
                gh issue comment "$n" -R "$GITHUB_REPOSITORY" \
                  -b "runner MAK (barrido): descarga fallo 2+ veces -- el post parece PRIVADO o BORRADO (Instagram exige login). Marcado estado/pendiente-datos y excluido de reintentos. Para reactivar: responder con un link publico en un issue nuevo, o quitar la label tras corregir."
              else
                gh issue comment "$n" -R "$GITHUB_REPOSITORY" \
                  -b "runner MAK (barrido): descarga FALLO en run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (reintento automatico en 30 min; al 2do fallo se marca pendiente-datos)."
              fi
              continue
            fi
            # --- render Blender MAK: OFF (2026-07-23), ver meta-regla arriba ---
            # bloque original (curl ollama + render_flyer_mak.py + comentario
            # render OK/cierre) preservado atras de `if false` para retomar
            # cuando el render en MAK pase verificacion de varianza.
            if false; then
              curl -s http://127.0.0.1:11434/api/generate -d '{"model":"gemma3:4b","keep_alive":0}' > /dev/null || true
              salida=$(python3 tools/render_flyer_mak.py --imagen "$out/input_ig.jpg" --out "$out" 2>&1)
              echo "$salida"
              if printf '%s\n' "$salida" | grep -q '^RENDER_OK:'; then
                gh issue comment "$n" -R "$GITHUB_REPOSITORY" \
                  -b "runner MAK (barrido): render OK; la entrega se publica solo en OneDrive."
                gh issue close "$n" -R "$GITHUB_REPOSITORY"
              else
                detalle=$(printf '%s\n' "$salida" | grep -E '^RENDER_FALLO:' | tail -1)
                gh issue comment "$n" -R "$GITHUB_REPOSITORY" \
                  -b "runner MAK (barrido): render FALLO ($detalle) en run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID -- descarga OK, issue sigue abierto."
              fi
            fi
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" \
              -b "runner MAK (barrido): descarga OK; entrega final solo en OneDrive. Render pendiente. Issue sigue abierto."
            gh issue edit "$n" -R "$GITHUB_REPOSITORY" --add-label "estado/revision" || true
          done
          echo "dir=$barrido_dir" >> "$GITHUB_OUTPUT"
