name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, mak, rd, iskvw]
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      # `render` va incluido a proposito: sin rasterizador el critico
      # perceptual del motor semantico no se ejecuta y CI daria verde sobre
      # codigo que nadie corrio.
      - run: python -m pip install -e ".[dev,render]"
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build:context
        working-directory: web
      # El sustrato, ANTES de los tests. `archivo.json` esta gitignoreado y
      # solo lo generaba el workflow de publicacion, asi que la suite media un
      # mundo de UNA fuente (campo.json) mientras el sitio servia otro. Medido
      # el 2026-07-31: con el sustrato presente la piel dibujaba 203 marcas por
      # cuadro en vez de 7647 y el patch de efectos quedaba inerte, con la
      # suite entera en verde. Un instrumento que solo mide la condicion facil
      # no puede acusar a nadie. El generador avisa que no alcanza el micelio
      # (la caja no es visible desde CI) y sigue con el material del repo: eso
      # es lo esperado, no un error.
      - run: python tools/gen_archivo_iskvw.py --fuente todo
      - run: python -m flujo verify
