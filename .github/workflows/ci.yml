name: CI
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      # `render` va incluido a proposito: sin rasterizador el critico
      # perceptual del motor semantico no se ejecuta y CI daria verde sobre
      # codigo que nadie corrio.
      - run: python -m pip install -e ".[dev,render]"
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build:context
        working-directory: web
      # El sustrato, ANTES de los tests. `archivo.json` esta gitignoreado y
      # debe generarse en CI igual que en Pages; de lo contrario la suite
      # mediria solo el fallback `campo.json` mientras el sitio serviria otra
      # proyeccion. El generador avisa si no alcanza el micelio privado y usa
      # el snapshot versionado: eso es lo esperado, no un error.
      - run: python tools/gen_archivo_iskvw.py --fuente todo
      - run: python -m flujo verify
